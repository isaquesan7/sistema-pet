name: PointVet backup worker container check
on:
  push:
    branches: [feat/pointvet-17-1-backup-foundation]
  pull_request:
    branches: [main]
jobs:
  container-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Bash syntax
        run: bash -n backup-worker/scripts/backup-worker.sh
      - name: Build isolated backup container
        run: docker build -t pointvet-backup-check backup-worker
      - name: Validate tools without accessing real database or R2
        run: |
          docker run --rm \
            -e R2_BUCKET=test-only \
            -e R2_ENDPOINT=https://invalid.example \
            -e R2_ACCESS_KEY_ID=dummy \
            -e R2_SECRET_ACCESS_KEY=dummy \
            -e BACKUP_AGE_RECIPIENT=age1ncad5llfn9q38cpsd08zz550525h2glldwsmv53ypu3v9j2tdfjqcyxh8r \
            -e BACKUP_MODE=check pointvet-backup-check
      - name: Verify production mode cannot start without explicit authorization
        run: |
          if docker run --rm \
            -e R2_BUCKET=test-only -e R2_ENDPOINT=https://invalid.example \
            -e R2_ACCESS_KEY_ID=dummy -e R2_SECRET_ACCESS_KEY=dummy \
            -e BACKUP_AGE_RECIPIENT=age1ncad5llfn9q38cpsd08zz550525h2glldwsmv53ypu3v9j2tdfjqcyxh8r \
            -e BACKUP_MODE=run pointvet-backup-check; then
            echo "Worker must reject unapproved execution" >&2
            exit 1
          fi
