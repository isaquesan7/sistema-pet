name: PointVet guided activation contracts
on:
  pull_request:
    paths:
      - "api/src/modules/saas/activation.controller.js"
      - "api/src/modules/saas/saas.routes.js"
      - "api/tests/activation.contract.test.mjs"
      - ".github/workflows/pointvet-activation.yml"
  workflow_dispatch:
jobs:
  activation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: node --check api/src/modules/saas/activation.controller.js
      - run: node --test api/tests/activation.contract.test.mjs
