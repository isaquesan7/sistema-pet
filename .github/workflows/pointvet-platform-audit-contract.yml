name: PointVet platform audit access contract
on:
  pull_request:
    paths:
      - "api/src/modules/saas/platform-audit.js"
      - "api/src/modules/saas/saas.routes.js"
      - "api/tests/platform-audit.contract.test.mjs"
      - ".github/workflows/pointvet-platform-audit-contract.yml"
  workflow_dispatch:
jobs:
  audit-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test api/tests/platform-audit.contract.test.mjs
