name: PointVet 17.1 isolated restore integration test
on:
  push:
    branches: [feat/pointvet-17-1-backup-foundation]
  pull_request:
    branches: [main]
jobs:
  restore-synthetic-data:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pointvet_ci
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: pointvet_backup_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pointvet_ci -d pointvet_backup_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      BACKUP_DATABASE_URL: postgresql://pointvet_ci:ci_only@127.0.0.1:5432/pointvet_backup_ci
      RESTORE_DATABASE_URL: postgresql://pointvet_ci:ci_only@127.0.0.1:5432/pointvet_restore_ci
      RESTORE_TEST_CONFIRM: pointvet_restore_ci
      PGPASSWORD: ci_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PostgreSQL 16 CLI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-16
      - name: Prepare synthetic records and empty restore database
        run: |
          psql -h 127.0.0.1 -U pointvet_ci -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE pointvet_restore_ci"
          psql -h 127.0.0.1 -U pointvet_ci -d pointvet_backup_ci -v ON_ERROR_STOP=1 -c "CREATE TABLE backup_test (id integer PRIMARY KEY, description text NOT NULL); INSERT INTO backup_test VALUES (1, 'sample-only'), (2, 'no-personal-data');"
      - name: Backup synthetic source DB
        run: node api/scripts/backup.mjs /tmp/pointvet-synthetic.dump
      - name: Verify archive and hash
        run: |
          pg_restore --list /tmp/pointvet-synthetic.dump >/dev/null
          cd /tmp && sha256sum -c pointvet-synthetic.dump.sha256
      - name: Restore into separate empty test DB
        run: node api/scripts/restore-drill.mjs /tmp/pointvet-synthetic.dump
      - name: Verify restored rows
        run: |
          rows=$(psql -h 127.0.0.1 -U pointvet_ci -d pointvet_restore_ci -t -A -c "SELECT count(*) FROM backup_test")
          test "$rows" = "2"
      - name: Ensure restore refuses populated destination
        run: |
          if node api/scripts/restore-drill.mjs /tmp/pointvet-synthetic.dump; then
            echo "Restore unexpectedly accepted populated destination" >&2
            exit 1
          fi
