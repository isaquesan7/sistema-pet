  isolated-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pointvet_ci
          POSTGRES_PASSWORD: pointvet_ci_only
          POSTGRES_DB: pointvet_unified_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pointvet_ci -d pointvet_unified_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://pointvet_ci:pointvet_ci_only@localhost:5432/pointvet_unified_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Install API dependencies
        working-directory: api
        run: npm ci
      - name: Apply all migrations to disposable PostgreSQL
        working-directory: api
        run: npm run db:deploy
      - name: Generate Prisma client
        working-directory: api
        run: npm run db:generate
      - name: Verify cross-company drafts and isolated sandbox sale shells
        working-directory: api
        env:
          NODE_ENV: test
          POINTVET_UNIFIED_SALES_SANDBOX: "1"
        run: node --import tsx --test tests/pdv-unificado-integration.test.mjs
      - name: Verify reconciled prepaid credit and causal reversal on disposable database
        working-directory: api
        env:
          NODE_ENV: test
          POINTVET_UNIFIED_SALES_SANDBOX: "1"
        run: node --import tsx --test tests/client-credit-ledger.integration.test.mjs
      - name: Verify fiscal multiissuer and operational topology on isolated PostgreSQL
        working-directory: api
        env:
          NODE_ENV: test
          POINTVET_UNIFIED_SALES_SANDBOX: "1"
        run: node --import tsx --test tests/pdv-unificado-fiscal.integration.test.mjs
      - name: Verify assisted fiscal topology migration, tenant isolation and logical reversal in CI
        working-directory: api
        env:
          NODE_ENV: test
          POINTVET_UNIFIED_SALES_SANDBOX: "1"
        run: node --import tsx --test tests/pdv-unificado-fiscal-migracao.integration.test.mjs
      - name: Verify draft columns and revision conflict
        working-directory: api
        run: node --test tests/pdv-unificado-postgres.smoke.mjs
      - name: M.5.3 verify real Express HTTP health, auth boundaries and read-only behavior on CI
        working-directory: api
        env:
          NODE_ENV: test
          POINTVET_UNIFIED_SALES_SANDBOX: "1"
        run: node --import tsx --test tests/pointvet-m53-local-smoke.integration.test.mjs
      - name: M.5.4.3 HTTP release barrier cross-tenant, revocation and no checkout on disposable DB
        working-directory: api
        env:
          NODE_ENV: test
          POINTVET_UNIFIED_SALES_SANDBOX: "1"
        run: node --import tsx --test tests/pointvet-m543-http-checkout-barrier.integration.test.mjs
      - name: Verify opt-in manual HTTP checkout atomicity, tenant ACL, grams and replay in CI
        working-directory: api
        env:
          NODE_ENV: test
          POINTVET_UNIFIED_SALES_SANDBOX: "1"
          POINTVET_UNIFIED_MANUAL_CHECKOUT_ENABLED: "0"
          POINTVET_UNIFIED_MANUAL_CHECKOUT_ORG_IDS: ""
          POINTVET_UNIFIED_MANUAL_CHECKOUT_COMPANY_IDS: ""
        run: node --import tsx --test tests/pointvet-manual-checkout-http.integration.test.mjs
      - name: M.5.1 exercise actual synthetic CI backup / full database restore / rollback
        working-directory: api
        env:
          NODE_ENV: test
          POINTVET_UNIFIED_SALES_SANDBOX: "1"
        run: bash scripts/ci-pointvet-backup-restore-drill.sh
      - name: M.5.71 verify CNPJ-scoped commands and legacy orders on isolated PostgreSQL
        working-directory: api
        env:
          NODE_ENV: test
        run: node --import tsx --test tests/pdv-comandas-cnpj.integration.test.mjs
