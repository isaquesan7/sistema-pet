name: PointVet Unified PDV Foundation
on:
  pull_request:
    paths:
      - "api/prisma/schema.prisma"
      - "api/prisma/migrations/20261013181500_unified_pdv_org_optin/**"
      - "api/src/modules/pdv/pdv-unificado.routes.js"
      - "api/src/modules/pdv/pdv-unificado.service.js"
      - "api/src/modules/pdv/pdv-unificado-preparacao.service.js"
      - "admin-web/src/pages/UnifiedPdvPreviewPage.jsx"
      - "admin-web/src/pages/PdvPage.jsx"
      - "admin-web/src/App.jsx"
      - "admin-web/src/clients.css"
      - "api/src/modules/organizacoes/organizacoes.schema.js"
      - "api/src/app.js"
      - "api/tests/pdv-unificado-foundation.contract.test.mjs"
      - "api/tests/pdv-unificado-postgres.smoke.mjs"
      - "api/tests/pdv-unificado-integration.test.mjs"
      - "api/prisma/migrations/20261013222500_unified_comanda_draft/**"
      - "api/prisma/migrations/20261014100000_unified_closing_reservations/**"
      - "admin-web/src/pages/SettingsPage.jsx"
      - ".github/workflows/pointvet-unified-pdv-foundation.yml"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Static checks
        run: |
          node --check api/src/modules/pdv/pdv-unificado.routes.js
          node --check api/src/modules/pdv/pdv-unificado.service.js
          node --check api/src/modules/pdv/pdv-unificado-preparacao.service.js
          node --check api/src/app.js
          node --test api/tests/pdv-unificado-foundation.contract.test.mjs
      - name: Prisma schema
        working-directory: api
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
        run: |
          npm ci
          npx prisma validate
      - name: Admin build
        working-directory: admin-web
        run: |
          npm ci
          npm run build

  isolated-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pointvet_ci
          POSTGRES_PASSWORD: pointvet_ci_only
          POSTGRES_DB: pointvet_unified_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pointvet_ci -d pointvet_unified_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://pointvet_ci:pointvet_ci_only@localhost:5432/pointvet_unified_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Install API dependencies
        working-directory: api
        run: npm ci
      - name: Apply all migrations to disposable PostgreSQL
        working-directory: api
        run: npm run db:deploy
      - name: Generate Prisma client
        working-directory: api
        run: npm run db:generate
      - name: Verify cross-company draft operations
        working-directory: api
        run: node --import tsx --test tests/pdv-unificado-integration.test.mjs
      - name: Verify draft columns and revision conflict
        working-directory: api
        run: node --test tests/pdv-unificado-postgres.smoke.mjs
