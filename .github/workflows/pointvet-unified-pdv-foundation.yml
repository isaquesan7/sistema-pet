name: PointVet Unified PDV Foundation
on:
  pull_request:
    paths:
      - "POINTVET_CONTINUIDADE_OFICIAL.md"
      - "POINTVET_GATES_PUBLICACAO.md"
      - "POINTVET_DECISAO_PAGAMENTOS_MANUAIS.md"
      - "POINTVET_20_1_UNIFIED_PDV_FOUNDATION.md"
      - "api/prisma/schema.prisma"
      - "api/prisma/migrations/20261013213000_client_quotes_credit_foundation/**"
      - "api/src/modules/clientes/client-finance.service.js"
      - "api/src/modules/clientes/client-credit-ledger.contract.js"
      - "api/src/modules/clientes/client-credit-ledger-sandbox.service.js"
      - "api/tests/client-credit-ledger.contract.test.mjs"
      - "api/tests/client-credit-ledger.integration.test.mjs"
      - "api/prisma/migrations/20261014235900_client_credit_causal_ledger/**"
      - "api/src/modules/clientes/client-quote-pdv-preview.service.js"
      - "api/src/modules/clientes/client-quote-pdv-conversion-sandbox.service.js"
      - "api/prisma/migrations/20261014234500_quote_to_unified_draft/**"
      - "api/src/modules/clientes/client-finance.routes.js"
      - "api/tests/client-quotes-credit.contract.test.mjs"
      - "admin-web/src/components/ClientQuotesTab.jsx"
      - "admin-web/src/components/ClientCreditTab.jsx"
      - "admin-web/src/pages/ClientDetailPage.jsx"
      - "POINTVET_QUOTES_CREDIT_FOUNDATION.md"
      - "POINTVET_M4_FISCAL_ORCAMENTOS_ARQUITETURA.md"
      - "api/prisma/migrations/20261013181500_unified_pdv_org_optin/**"
      - "api/src/modules/pdv/pdv-unificado.routes.js"
      - "api/src/modules/pdv/pdv-unificado.service.js"
      - "api/src/modules/pdv/pdv-unificado-preparacao.service.js"
      - "api/src/modules/pdv/pdv-unificado-venda-sandbox.service.js"
      - "api/src/modules/pdv/pdv-unificado-autorizacao-sandbox.service.js"
      - "api/src/modules/pdv/pdv-unificado-psp-sandbox.contract.js"
      - "api/src/modules/pdv/pdv-unificado-recebedores-sandbox.service.js"
      - "api/src/modules/pdv/pdv-unificado-consulta-psp.contract.js"
      - "api/src/modules/pdv/pdv-unificado-recebimento-manual.contract.js"
      - "api/src/modules/pdv/pdv-unificado-registro-manual-sandbox.service.js"
      - "api/src/modules/pdv/pdv-unificado-fechamento-manual.contract.js"
      - "api/src/modules/pdv/pdv-unificado-fechamento-manual-sandbox.service.js"
      - "api/src/modules/pdv/pdv-unificado-estorno-manual.contract.js"
      - "api/src/modules/pdv/pdv-unificado-estorno-manual-sandbox.service.js"
      - "api/tests/pdv-unificado-estorno-manual.contract.test.mjs"
      - "api/prisma/migrations/20261014223000_unified_manual_closing_reversal/**"
      - "api/tests/pdv-unificado-fechamento-manual.contract.test.mjs"
      - "api/prisma/migrations/20261014210000_unified_manual_closing_ledger_foundation/**"
      - "admin-web/src/pages/UnifiedPdvPreviewPage.jsx"
      - "admin-web/src/pages/PdvPage.jsx"
      - "admin-web/src/App.jsx"
      - "admin-web/src/clients.css"
      - "api/src/modules/organizacoes/organizacoes.schema.js"
      - "api/src/app.js"
      - "api/tests/pdv-unificado-foundation.contract.test.mjs"
      - "api/tests/pdv-unificado-postgres.smoke.mjs"
      - "api/tests/pdv-unificado-integration.test.mjs"
      - "api/tests/pdv-unificado-psp-contract.test.mjs"
      - "api/tests/pdv-unificado-recebimento-manual.contract.test.mjs"
      - "api/prisma/migrations/20261013222500_unified_comanda_draft/**"
      - "api/prisma/migrations/20261014100000_unified_closing_reservations/**"
      - "api/prisma/migrations/20261014113000_unified_sale_preparation/**"
      - "api/prisma/migrations/20261014140000_unified_sandbox_sale_state/**"
      - "api/prisma/migrations/20261014153000_unified_auth_outbox_sandbox/**"
      - "api/prisma/migrations/20261014170000_unified_outbox_lease_reconciliation/**"
      - "api/prisma/migrations/20261014183000_unified_mock_receivers_status_evidence/**"
      - "api/prisma/migrations/20261014193000_unified_manual_receipt_declarations/**"
      - "admin-web/src/pages/SettingsPage.jsx"
      - ".github/workflows/pointvet-unified-pdv-foundation.yml"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Static checks
        run: |
          node --check api/src/modules/pdv/pdv-unificado.routes.js
          node --check api/src/modules/pdv/pdv-unificado.service.js
          node --check api/src/modules/pdv/pdv-unificado-preparacao.service.js
          node --check api/src/modules/pdv/pdv-unificado-venda-sandbox.service.js
          node --check api/src/modules/pdv/pdv-unificado-autorizacao-sandbox.service.js
          node --check api/src/modules/pdv/pdv-unificado-psp-sandbox.contract.js
          node --check api/src/modules/pdv/pdv-unificado-recebedores-sandbox.service.js
          node --check api/src/modules/pdv/pdv-unificado-consulta-psp.contract.js
          node --check api/src/modules/pdv/pdv-unificado-recebimento-manual.contract.js
          node --check api/src/modules/pdv/pdv-unificado-registro-manual-sandbox.service.js
          node --check api/src/modules/pdv/pdv-unificado-fechamento-manual.contract.js
          node --check api/src/modules/pdv/pdv-unificado-fechamento-manual-sandbox.service.js
          node --check api/src/modules/pdv/pdv-unificado-estorno-manual.contract.js
          node --check api/src/modules/pdv/pdv-unificado-estorno-manual-sandbox.service.js
          node --check api/src/app.js
          node --check api/src/modules/clientes/client-finance.service.js
          node --check api/src/modules/clientes/client-credit-ledger.contract.js
          node --check api/src/modules/clientes/client-credit-ledger-sandbox.service.js
          node --test api/tests/client-credit-ledger.contract.test.mjs
          node --check api/src/modules/clientes/client-quote-pdv-preview.service.js
          node --check api/src/modules/clientes/client-quote-pdv-conversion-sandbox.service.js
          node --check api/src/modules/clientes/client-finance.routes.js
          node --test api/tests/client-quotes-credit.contract.test.mjs
          node --test api/tests/pdv-unificado-foundation.contract.test.mjs
          node --test api/tests/pdv-unificado-psp-contract.test.mjs
          node --test api/tests/pdv-unificado-fechamento-manual.contract.test.mjs
          node --test api/tests/pdv-unificado-estorno-manual.contract.test.mjs
      - name: Prisma schema
        working-directory: api
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
        run: |
          npm ci
          npx prisma validate
          node --test tests/pdv-unificado-recebimento-manual.contract.test.mjs
      - name: Admin build
        working-directory: admin-web
        run: |
          npm ci
          npm run build

  isolated-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pointvet_ci
          POSTGRES_PASSWORD: pointvet_ci_only
          POSTGRES_DB: pointvet_unified_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pointvet_ci -d pointvet_unified_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://pointvet_ci:pointvet_ci_only@localhost:5432/pointvet_unified_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Install API dependencies
        working-directory: api
        run: npm ci
      - name: Apply all migrations to disposable PostgreSQL
        working-directory: api
        run: npm run db:deploy
      - name: Generate Prisma client
        working-directory: api
        run: npm run db:generate
      - name: Verify cross-company drafts and isolated sandbox sale shells
        working-directory: api
        env:
          NODE_ENV: test
          POINTVET_UNIFIED_SALES_SANDBOX: "1"
        run: node --import tsx --test tests/pdv-unificado-integration.test.mjs
      - name: Verify reconciled prepaid credit and causal reversal on disposable database
        working-directory: api
        env:
          NODE_ENV: test
          POINTVET_UNIFIED_SALES_SANDBOX: "1"
        run: node --import tsx --test tests/client-credit-ledger.integration.test.mjs
      - name: Verify draft columns and revision conflict
        working-directory: api
        run: node --test tests/pdv-unificado-postgres.smoke.mjs
