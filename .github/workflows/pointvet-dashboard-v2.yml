name: PointVet Dashboard V2
on:
  pull_request:
    paths:
      - "api/src/modules/relatorios/relatorios.service.js"
      - "admin-web/src/dashboard.css"
      - "admin-web/src/pages/DashboardV2Page.jsx"
      - "admin-web/src/pages/PlatformAdminPage.jsx"
      - "admin-web/src/layout/AppLayout.jsx"
      - "admin-web/src/App.jsx"
      - ".github/workflows/pointvet-dashboard-v2.yml"
  workflow_dispatch:
jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: "npm", cache-dependency-path: "admin-web/package-lock.json"}
      - name: Install and build
        working-directory: admin-web
        run: |
          npm ci
          npm run build
      - run: node --check api/src/modules/relatorios/relatorios.service.js
      - name: Check report source and readable UI
        run: |
          grep -q '/relatorios/painel' admin-web/src/pages/DashboardV2Page.jsx
          grep -q 'window.print()' admin-web/src/pages/DashboardV2Page.jsx
          grep -q 'pointvet:sidebar-collapsed' admin-web/src/layout/AppLayout.jsx
